<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="build" content="__BUILD_SHA__" />
    <title>sched-prod · incidents</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight · <span class="updated" aria-live="polite"></span></p>
      <!-- Decision 0001: Ack asks to confirm, and the confirm names the incident id. The slot keeps its height,
           so opening the confirm never moves the list; it sits above the list and covers no Ack button. -->
      <div class="confirm-slot">
        <div data-testid="confirm" class="confirm" role="alertdialog" aria-live="assertive" hidden>
          <span class="confirm-text"></span>
          <button type="button" data-testid="confirm-ack">Ack</button>
          <button type="button" data-testid="confirm-cancel">Cancel</button>
        </div>
      </div>
    </header>
    <main data-testid="board">
      <p data-testid="loader" class="loader" role="status">Loading incidents…</p>
      <p data-testid="empty" class="empty" hidden>No incidents tonight.</p>
      <p class="error" role="alert" hidden></p>
      <ul data-testid="incident-list" class="list"></ul>
    </main>
    <footer>sched-prod incident board · build <span data-testid="build-sha">__BUILD_SHA__</span></footer>
  </body>
</html>
